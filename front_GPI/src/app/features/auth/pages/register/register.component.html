<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h2>Créer un compte</h2>
      <p>Rejoignez la plateforme GPI</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-group">
        <label for="name">Nom complet</label>
        <input type="text" id="name" [(ngModel)]="name" name="name" required placeholder="Jean Dupont">
      </div>

      <div class="form-group">
        <label for="email">Adresse Email</label>
        <input type="email" id="email" [(ngModel)]="email" name="email" required placeholder="exemple@gpi.com">
      </div>

      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" [(ngModel)]="password" name="password" required placeholder="•••••••• (min 6 caractères)">
      </div>

      <div class="error-message" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <button type="submit" class="btn-primary" [disabled]="isLoading">
        <span *ngIf="!isLoading">S'inscrire</span>
        <span *ngIf="isLoading" class="loader"></span>
      </button>
    </form>

    <div class="auth-footer">
      <p>Vous avez déjà un compte ?</p>
      <button class="btn-secondary" routerLink="/auth/login">Se connecter</button>
    </div>
  </div>
</div>
