<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h2>Bienvenue !</h2>
      <p>Connectez-vous à votre compte GPI</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-group">
        <label for="email">Adresse Email</label>
        <input type="email" id="email" [(ngModel)]="email" name="email" required placeholder="exemple@gpi.com">
      </div>

      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" [(ngModel)]="password" name="password" required placeholder="••••••••">
      </div>

      <div class="error-message" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <button type="submit" class="btn-primary" [disabled]="isLoading">
        <span *ngIf="!isLoading">Se connecter</span>
        <span *ngIf="isLoading" class="loader"></span>
      </button>
    </form>

    <div class="auth-footer">
      <p>Pas encore de compte ?</p>
      <button class="btn-secondary" routerLink="/auth/register">Créer un compte</button>
    </div>
  </div>
</div>
