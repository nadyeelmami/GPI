<div class="page-container">
  <div class="page-header">
    <h1>Mes Cours</h1>
    <p>Consultez la liste de vos cours et suivez votre progression.</p>
  </div>

  <div class="courses-grid">
    <div class="course-card" *ngFor="let course of courses">
      <div class="course-header">
        <span class="status-badge" [ngClass]="{'en-cours': course.status === 'En cours', 'termine': course.status === 'Terminé', 'nouveau': course.status === 'Nouveau'}">
          {{ course.status }}
        </span>
      </div>
      <h3 class="course-title">{{ course.name }}</h3>
      <p class="course-teacher">Enseignant : {{ course.teacher }}</p>
      
      <div class="progress-container">
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" [style.width.%]="course.progress" [ngClass]="{'completed': course.progress === 100}"></div>
        </div>
        <span class="progress-text">{{ course.progress }}% complété</span>
      </div>

      <button class="btn-action">Accéder au cours</button>
    </div>
  </div>
</div>
