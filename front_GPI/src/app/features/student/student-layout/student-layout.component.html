<div class="wrapper">

  <aside class="sidebar" [class.collapsed]="isCollapsed">
    <div class="sidebar-glow"></div>
    <div class="sidebar-glow2"></div>

    <div class="sidebar-header">
      <img src="/logo-iscae.png" alt="ISCAE Logo" class="logo-img">
      <div class="logo-text">
        <span class="logo-title">ISCAE</span>
        <span class="logo-sub">Espace Étudiant</span>
      </div>
    </div>

    <nav class="sidebar-nav">
      <a class="nav-link" routerLink="/student/dashboard" routerLinkActive="active">
        <div class="nav-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
            <rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
          </svg>
        </div>
        <span class="nav-link-text">Tableau de bord</span>
      </a>

      <a class="nav-link" routerLink="/student/grades" routerLinkActive="active">
        <div class="nav-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>
          </svg>
        </div>
        <span class="nav-link-text">Mes Notes & Moyennes</span>
      </a>

      <a class="nav-link" routerLink="/student/profile" routerLinkActive="active">
        <div class="nav-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
          </svg>
        </div>
        <span class="nav-link-text">Mon Profil</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <a class="settings-btn" (click)="openChangePasswordModal()">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
        <span class="settings-text">Changer mot de passe</span>
      </a>

      <a class="logout-btn" (click)="onLogout()">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        <span class="logout-text">Déconnexion</span>
      </a>
    </div>
  </aside>

  <main class="main-content">
    <router-outlet></router-outlet>
  </main>

  <!-- Modal de changement de mot de passe -->
  <div class="modal-overlay" [class.active]="showChangePasswordModal">
    <div class="modal-container">
      <div class="modal-header">
        <h3 class="modal-title">Changer le mot de passe</h3>
        <button class="close-btn" (click)="closeChangePasswordModal()" aria-label="Fermer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      
      @if (passwordError) {
        <div class="modal-error">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          <span>{{ passwordError }}</span>
        </div>
      }
      @if (passwordSuccess) {
        <div class="modal-success">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
            <polyline points="22 4 12 14.01 9 11.01"></polyline>
          </svg>
          <span>{{ passwordSuccess }}</span>
        </div>
      }
      
      <form (ngSubmit)="submitChangePassword()">
        <div class="form-group">
          <label class="form-label" for="oldPassword">Ancien mot de passe</label>
          <input class="form-input" type="password" id="oldPassword" name="oldPassword" [(ngModel)]="oldPassword" required placeholder="Saisir votre mot de passe actuel">
        </div>
        
        <div class="form-group">
          <label class="form-label" for="newPassword">Nouveau mot de passe</label>
          <input class="form-input" type="password" id="newPassword" name="newPassword" [(ngModel)]="newPassword" required placeholder="Minimum 6 caractères">
        </div>
        
        <div class="form-group">
          <label class="form-label" for="confirmPassword">Confirmer le nouveau mot de passe</label>
          <input class="form-input" type="password" id="confirmPassword" name="confirmPassword" [(ngModel)]="confirmPassword" required placeholder="Confirmer le nouveau mot de passe">
        </div>
        
        <div class="modal-footer">
          <button class="btn-cancel" type="button" (click)="closeChangePasswordModal()">Annuler</button>
          <button class="btn-submit" type="submit" [disabled]="isPasswordSubmitting">
            @if (isPasswordSubmitting) {
              <span class="spinner"></span>
              <span>Mise à jour...</span>
            } @else {
              <span>Enregistrer</span>
            }
          </button>
        </div>
      </form>
    </div>
  </div>

</div>
